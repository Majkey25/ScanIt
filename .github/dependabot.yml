# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: cron
      cronjob: "23 6 * * 0,4"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "52 23 * * 1,4"
      timezone: Etc/UTC
    open-pull-requests-limit: 5

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Run quality gate
        shell: pwsh
        run: ./tools/build.ps1 -AllowUnsigned

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanit-ci-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/internal/debug/app-internal-debug.apk
            app/build/outputs/apk/github/release/app-github-release-unsigned.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/bundle/githubRelease/app-github-release.aab
            app/build/reports/lint-results-internalDebug.html
            app/build/reports/lint-results-playRelease.html
            app/build/reports/lint-results-githubRelease.html
